# Application
quarkus:
  application:
    name: table-entry-service

  # HTTP
  http:
    port: 8080
    cors:
      ~: true
      origins: http://localhost:3000,http://localhost:5173
      methods: GET,POST,PUT,DELETE,OPTIONS
      headers: Content-Type,Authorization

  # H2 Database
  datasource:
    db-kind: h2
    username: sa
    password: ""
    jdbc:
      url: jdbc:h2:mem:tableentrydb;DB_CLOSE_DELAY=-1

  # Hibernate
  hibernate-orm:
    database:
      generation: drop-and-create
    log:
      sql: false
